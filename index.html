<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Book</title>
  <style>
    :root {
      --book-width: 320px;
      --book-height: 420px;
      --page-count: 6;
      --base-tilt: 8deg;
      --transition-speed: 140ms;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 25% 25%, #2c2f42, #1b1d2d 55%);
      color: #f3f6ff;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    .scene {
      perspective: 1200px;
      width: var(--book-width);
      height: var(--book-height);
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      box-shadow: 0 22px 40px rgba(0, 0, 0, 0.4);
      border-radius: 14px;
    }

    .page {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(230, 236, 255, 0.9));
      transform-style: preserve-3d;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
      transform-origin: left center;
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.7), transparent 35%, transparent 65%, rgba(0, 0, 0, 0.06));
      pointer-events: none;
    }

    .page h1,
    .page p {
      margin: 0;
      padding: 18px 20px 12px;
      color: #1d2034;
    }

    .page h1 {
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    .page p {
      line-height: 1.5;
      opacity: 0.85;
    }

    .page:nth-child(1) { transform: translateZ(-12px) rotateY(-2deg); }
    .page:nth-child(2) { transform: translateZ(-8px) rotateY(-1.6deg); }
    .page:nth-child(3) { transform: translateZ(-4px) rotateY(-1.2deg); }
    .page:nth-child(4) { transform: translateZ(0px) rotateY(-0.8deg); }
    .page:nth-child(5) { transform: translateZ(4px) rotateY(-0.4deg); }
    .page:nth-child(6) { transform: translateZ(8px); }

    .spine {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #e7eaf5, #c2c8e0);
      border-radius: 12px;
      transform: translateZ(-16px) rotateY(-4deg);
      box-shadow: 0 16px 24px rgba(0, 0, 0, 0.28);
    }

    .cover {
      position: absolute;
      inset: -8px;
      background: linear-gradient(135deg, #4b63f6, #8691ff);
      border-radius: 16px;
      transform: translateZ(18px) rotateY(2deg);
      box-shadow: 0 24px 36px rgba(0, 0, 0, 0.4);
    }

    .cover::after {
      content: "Interactive Notebook";
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.12);
      color: #f5f7ff;
      font-weight: 600;
      letter-spacing: 0.6px;
      border-radius: 10px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="book" id="book">
      <div class="spine"></div>
      <div class="page">
        <h1>Notes</h1>
        <p>Hover and move your cursor to tilt the book. Layers of pages add depth and motion.</p>
      </div>
      <div class="page"></div>
      <div class="page"></div>
      <div class="page"></div>
      <div class="page"></div>
      <div class="page"></div>
      <div class="cover"></div>
    </div>
  </div>

  <script>
    const book = document.getElementById("book");
    const pages = Array.from(document.querySelectorAll(".page"));

    const bounds = { x: 0, y: 0 };
    const baseTilt = 8;
    const pageTurn = 4;

    function updateTransform() {
      const rotateY = ((bounds.x - 0.5) * baseTilt).toFixed(2);
      const rotateX = ((0.5 - bounds.y) * baseTilt).toFixed(2);

      book.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      pages.forEach((page, index) => {
        const depthShift = (index - pages.length / 2) * 0.3;
        const pageTilt = ((bounds.x - 0.5) * pageTurn * ((index + 1) / pages.length)).toFixed(2);
        page.style.transform = `translateZ(${(index - 2) * 4 + depthShift}px) rotateY(${pageTilt}deg)`;
        page.style.boxShadow = `0 12px 18px rgba(0, 0, 0, ${0.22 + index * 0.02})`;
      });
    }

    function handleMove(event) {
      const rect = book.getBoundingClientRect();
      bounds.x = (event.clientX - rect.left) / rect.width;
      bounds.y = (event.clientY - rect.top) / rect.height;
      updateTransform();
    }

    function resetTilt() {
      bounds.x = 0.5;
      bounds.y = 0.5;
      updateTransform();
    }

    resetTilt();

    book.addEventListener("mousemove", handleMove);
    book.addEventListener("mouseleave", resetTilt);
  </script>
</body>
</html>
